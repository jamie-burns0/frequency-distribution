quarkus.rest-client.random-integers.url=https://random-integers-docker-jvm:8080
%dev.quarkus.rest-client.random-integers.url=http://localhost:8081

%prod.max-number-of-integers=1000
%dev.max-number-of-integers=100
%test.max-number-of-integers=10

quarkus.fault-tolerance."random-integers-client-retry".retry.max-retries=10
%dev.quarkus.fault-tolerance."random-integers-client-retry".retry.max-retries=3
%test.quarkus.fault-tolerance."random-integers-client-retry".retry.max-retries=1
